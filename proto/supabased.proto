syntax = "proto3";
package supabased;

service Supabased {
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIResponse);
  rpc StartGithubDeviceAuth (StartGithubDeviceAuthRequest) returns (StartGithubDeviceAuthResponse);
  rpc FinishGithubDeviceAuth (FinishGithubDeviceAuthRequest) returns (FinishGithubDeviceAuthResponse);
  rpc RefreshSession (RefreshSessionRequest) returns (AuthResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc ListProjects (ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateBranch (CreateBranchRequest) returns (CreateBranchResponse);
  rpc ListBranches (ListBranchesRequest) returns (ListBranchesResponse);
  rpc DeleteBranch (DeleteBranchRequest) returns (DeleteBranchResponse);
  rpc GetBranchCredentials (GetBranchCredentialsRequest) returns (BranchCredentials);
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string identity = 1;
  repeated string permissions = 2;
  repeated string accessible_branches = 3;
}

// Removed PAT/API-key Authenticate request. Do not reuse these fields; old clients should fail safely.
message AuthRequest {
  reserved 1, 2;
  reserved "github_token", "api_key";
}

message StartGithubDeviceAuthRequest {}

message StartGithubDeviceAuthResponse {
  string auth_session_id = 1;
  string user_code = 2;
  string verification_uri = 3;
  int64 expires_in = 4;
  int64 interval = 5;
}

message FinishGithubDeviceAuthRequest {
  string auth_session_id = 1;
}

message GithubDeviceAuthPending {
  int64 interval = 1;
  string message = 2;
}

message FinishGithubDeviceAuthResponse {
  oneof result {
    AuthResponse auth = 1;
    GithubDeviceAuthPending pending = 2;
  }
}

message AuthResponse {
  string session_token = 1;
  string identity = 2;
  repeated string permissions = 3;
  int64 expires_at = 4;
  string refresh_token = 5;
  int64 refresh_expires_at = 6;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool revoked = 1;
}

// Project listing (config-driven, no Supabase API call)
message ListProjectsRequest {}
message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
}
message ProjectInfo {
  string name = 1;
}

// Branch operations
message CreateBranchRequest {
  string project_name = 1;
  string branch_name = 2;
}
message CreateBranchResponse {
  BranchInfo branch = 1;
}

message BranchInfo {
  string branch_name = 1;
  string project_name = 2;
  string status = 3;
  string created_at = 4;
  BranchOwnership ownership = 5;
}

enum BranchOwnership {
  BRANCH_OWNERSHIP_UNSPECIFIED = 0;
  BRANCH_OWNERSHIP_YOURS = 1;
  BRANCH_OWNERSHIP_OTHER = 2;
  BRANCH_OWNERSHIP_UNTRACKED = 3;
}

message ListBranchesRequest {
  string project_name = 1;  // empty = all projects
}
message ListBranchesResponse {
  repeated BranchInfo branches = 1;
}

message DeleteBranchRequest {
  string project_name = 1;
  string branch_name = 2;
}
message DeleteBranchResponse {
  bool deleted = 1;
}

message GetBranchCredentialsRequest {
  string project_name = 1;
  string branch_name = 2;
}
message BranchCredentials {
  string branch_name = 1;
  string project_name = 2;
  string api_url = 3;
  string anon_key = 4;
  string service_role_key = 5;
}
